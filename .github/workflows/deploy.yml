name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
      - preview
  # Also dispatched by mp2ez/being's legal-site-redeploy.yml when docs/legal
  # changes: being main -> this repo's main, being development -> preview.
  workflow_dispatch:
    inputs:
      legal_ref:
        description: >-
          BREAK-GLASS ONLY. Build legal pages from this mp2ez/being ref (e.g. the
          hotfix/* branch carrying a correction) instead of the target's default.
          Production then no longer matches being main, and being's
          legal-site-freshness check stays red until the fix lands there.
        required: false
        default: ''

# One deploy per environment at a time. A legal-content dispatch can arrive
# while a code push is deploying: queue instead of racing.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Website
    env:
      # Resolved once; drives the legal ref, the wrangler env and the smoke URL.
      # A dispatch on any other ref used to deploy to production and then smoke
      # the preview URL.
      TARGET: ${{ github.ref_name == 'main' && 'production' || github.ref_name == 'preview' && 'preview' || '' }}

    steps:
      - name: Refuse refs other than main and preview
        if: env.TARGET == ''
        run: |
          echo "::error::deploy.yml deploys main (production) or preview only, not '$GITHUB_REF_NAME'"
          exit 1

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Checkout legal content from being repo
        uses: ./.github/actions/checkout-legal
        with:
          target: ${{ env.TARGET }}
          ref-override: ${{ inputs.legal_ref }}
          token: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Configure npm for GitHub Packages
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GH_PACKAGES_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: npm ci

      - name: Build with OpenNext
        run: npx opennextjs-cloudflare build
        env:
          # Always serve the full site (both preview and main). The splash at /
          # is now unreachable in deployed envs — it stays in the codebase as
          # an emergency-fallback option but the runtime redirect carries
          # / → /home. /download serves as the pre-launch waitlist page.
          NEXT_PUBLIC_SHOW_FULL_SITE: 'true'
          # PostHog product analytics (EU cloud). When this secret is missing
          # or empty, AnalyticsGate renders nothing — graceful degradation.
          # GPC kill happens client-side regardless. See lib/posthog/config.ts.
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          # 'preview' turns on X-Robots-Tag: noindex and the legal-page preview
          # notice (preview serves being development's legal text).
          NEXT_PUBLIC_DEPLOY_TARGET: ${{ env.TARGET }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy ${{ env.TARGET == 'preview' && '--env preview' || '' }}

      - name: Post-deploy smoke against live URL
        run: |
          URL="${{ env.TARGET == 'production' && 'https://being.fyi' || 'https://being-website-preview.palouselabs.workers.dev' }}"
          echo "Smoke testing $URL ..."
          # Brief wait for Cloudflare edge propagation after deploy
          sleep 15
          # Cache-bust query param to avoid stale edge responses
          CB="?cb=$(date +%s)"
          # /home must return 200
          HOME_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL/home$CB")
          if [ "$HOME_CODE" != "200" ]; then
            echo "FAIL: $URL/home returned $HOME_CODE (expected 200)"
            exit 1
          fi
          # /download must contain pre-launch marker (update at app launch)
          if ! curl -sf "$URL/download$CB" | grep -q "Coming soon"; then
            echo "FAIL: $URL/download body missing 'Coming soon' marker"
            exit 1
          fi
          # /privacy must serve security headers (HSTS proves the security
          # headers pipeline is intact end-to-end through Cloudflare)
          if ! curl -sI "$URL/privacy" | grep -qi "strict-transport-security"; then
            echo "FAIL: $URL/privacy missing Strict-Transport-Security header"
            exit 1
          fi
          # noindex must be on preview and must never reach production, where
          # it would drop being.fyi from search results. This is the only check
          # that tells the new version from the old one, and a deploy can take
          # longer than the sleep above to reach the edge. So sample for up to
          # 60s: preview passes on the first noindex, production fails on the
          # first robots header.
          for i in $(seq 1 12); do
            ROBOTS=$(curl -sI "$URL/privacy?cb=$(date +%s)-$i" | grep -i '^x-robots-tag:' || true)
            if [ "$TARGET" = "preview" ] && echo "$ROBOTS" | grep -qi noindex; then
              break
            fi
            if [ "$TARGET" = "production" ] && [ -n "$ROBOTS" ]; then
              echo "FAIL: production $URL/privacy sends $ROBOTS"
              exit 1
            fi
            if [ "$i" -lt 12 ]; then sleep 5; fi
          done
          if [ "$TARGET" = "preview" ] && ! echo "$ROBOTS" | grep -qi noindex; then
            echo "FAIL: $URL/privacy missing X-Robots-Tag: noindex on preview after 60s"
            exit 1
          fi
          echo "Post-deploy smoke passed for $URL"
